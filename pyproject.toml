[project]
name = "pumpstaticrom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "einops>=0.8.2",
    "huggingface>=0.0.1",
    "huggingface-hub>=1.22.0",
    "ipykernel>=7.2.0",
    "jax[cpu]>=0.6.2",
    "jupyter>=1.1.1",
    "kennard-stone>=3.0.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pod-rbf",
    "shape-foundation",
    "polars>=1.42.1",
    "pyvista[jupyter]>=0.47.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "torch>=2.6.0",
    "torch-geometric>=2.8.0",
    "trimesh>=4.12.2",
    "xgboost>=3.2.0",
    "seaborn>=0.13.2",
    "torch2jax>=0.1.0",
    "dlpack>=0.1",
    "hydra-core>=1.3.4",
    "omegaconf>=2.3.1",
    "peft>=0.19.1",
    "plotly>=6.9.0",
    "numba>=0.61.0",
    "umap-learn>=0.5.7",
    "jupytext>=1.19.4",
    "pip>=26.1.2",
    "antigravity-nb",
    "mlflow>=3.15.1",
    "dvc>=3.67.1",
    "dvc-webdav>=3.0.1",
    "ruff>=0.16.3",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
smart = {path = "./smart", editable=true}
pod-rbf = { path = "../POD-RBF", editable = true }
shape-foundation = {path="./shape", editable = true}
torch = { index = "pytorch-cu124" }
antigravity-nb = { git = "https://github.com/Ian747-tw/Antigravity-Jupiter-Notebook-MCP.git" }

[tool.ruff.lint]
ignore = ["BLE001"]

